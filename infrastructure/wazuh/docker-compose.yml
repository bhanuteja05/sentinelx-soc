name: sentinelx-wazuh

# Isolated Wazuh single-node stack (official 4.14.8 architecture).
# Does not start with the SentinelX app stack.
# From repo root:
#   docker compose -f infrastructure/wazuh/generate-indexer-certs.yml --env-file .env run --rm generator
#   docker compose -f infrastructure/wazuh/docker-compose.yml --env-file .env up -d wazuh.indexer
#   docker compose -f infrastructure/wazuh/docker-compose.yml --env-file .env up -d wazuh.manager
#   docker compose -f infrastructure/wazuh/docker-compose.yml --env-file .env up -d wazuh.dashboard

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    hostname: wazuh.indexer
    restart: unless-stopped
    profiles: ["wazuh"]
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sentinelx_wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      - sentinelx-siem
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:9200 | grep -Eq '401|200'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    hostname: wazuh.manager
    restart: unless-stopped
    profiles: ["wazuh"]
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:?WAZUH_INDEXER_USERNAME is required}
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?WAZUH_INDEXER_PASSWORD is required}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USER:?WAZUH_API_USER is required}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD is required}
    volumes:
      - sentinelx_wazuh_api_configuration:/var/ossec/api/configuration
      - sentinelx_wazuh_etc:/var/ossec/etc
      - sentinelx_wazuh_logs:/var/ossec/logs
      - sentinelx_wazuh_queue:/var/ossec/queue
      - sentinelx_wazuh_var_multigroups:/var/ossec/var/multigroups
      - sentinelx_wazuh_integrations:/var/ossec/integrations
      - sentinelx_wazuh_active_response:/var/ossec/active-response/bin
      - sentinelx_wazuh_agentless:/var/ossec/agentless
      - sentinelx_wazuh_wodles:/var/ossec/wodles
      - sentinelx_wazuh_filebeat_etc:/etc/filebeat
      - sentinelx_wazuh_filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks:
      - sentinelx-siem
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/var/ossec/bin/wazuh-control status | grep -q 'is running'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    hostname: wazuh.dashboard
    restart: unless-stopped
    profiles: ["wazuh"]
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:5601"
    environment:
      INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:?WAZUH_INDEXER_USERNAME is required}
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?WAZUH_INDEXER_PASSWORD is required}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: ${WAZUH_DASHBOARD_USERNAME:?WAZUH_DASHBOARD_USERNAME is required}
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?WAZUH_DASHBOARD_PASSWORD is required}
      API_USERNAME: ${WAZUH_API_USER:?WAZUH_API_USER is required}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD is required}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - sentinelx_wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - sentinelx_wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      - sentinelx-siem
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:5601/ | grep -Eq '200|302|401'",
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s

networks:
  # sentinelx-siem is created by the root docker-compose.yml (app stack).
  # This compose joins it as an external consumer. Start the app stack first
  # (docker compose up -d) to ensure the network exists before starting Wazuh.
  sentinelx-siem:
    external: true
    name: sentinelx-siem

volumes:
  sentinelx_wazuh_indexer_data:
    name: sentinelx_wazuh_indexer_data
  sentinelx_wazuh_api_configuration:
    name: sentinelx_wazuh_api_configuration
  sentinelx_wazuh_etc:
    name: sentinelx_wazuh_etc
  sentinelx_wazuh_logs:
    name: sentinelx_wazuh_logs
  sentinelx_wazuh_queue:
    name: sentinelx_wazuh_queue
  sentinelx_wazuh_var_multigroups:
    name: sentinelx_wazuh_var_multigroups
  sentinelx_wazuh_integrations:
    name: sentinelx_wazuh_integrations
  sentinelx_wazuh_active_response:
    name: sentinelx_wazuh_active_response
  sentinelx_wazuh_agentless:
    name: sentinelx_wazuh_agentless
  sentinelx_wazuh_wodles:
    name: sentinelx_wazuh_wodles
  sentinelx_wazuh_filebeat_etc:
    name: sentinelx_wazuh_filebeat_etc
  sentinelx_wazuh_filebeat_var:
    name: sentinelx_wazuh_filebeat_var
  sentinelx_wazuh_dashboard_config:
    name: sentinelx_wazuh_dashboard_config
  sentinelx_wazuh_dashboard_custom:
    name: sentinelx_wazuh_dashboard_custom
